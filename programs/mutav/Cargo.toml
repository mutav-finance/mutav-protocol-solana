[package]
name = "mutav"
version = "0.1.0"
description = "MUTAV: on-chain, verifiable BRL guarantee reserve (core program)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "mutav"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi", "init-if-needed"] }
anchor-spl = { workspace = true, features = ["token_2022_extensions"] }
# SHA-256 for the investor allowlist Merkle proof (syscall on-chain; `sha2`
# only affects host builds, e.g. the LiteSVM tests).
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
