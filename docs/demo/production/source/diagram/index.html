<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>MUTAV live diagram preview</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 100 900; font-style: normal; src: url("assets/fonts/Inter.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; font-style: normal; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0e0f11; font-family: "Inter", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0e0f11; }
      .clip { position: absolute; inset: 0; }
      #grid { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        background-image: linear-gradient(to right, rgba(240,240,238,.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(240,240,238,.04) 1px, transparent 1px); background-size: 48px 48px; }
      /* placeholder app window; viewport = x 160–1760, y 212–880 */
      #win { position: absolute; left: 160px; top: 172px; width: 1600px; height: 708px; border-radius: 12px; background: #111214; box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 40px 90px -20px rgba(0,0,0,.8); overflow: hidden; }
      #chrome { position: absolute; left: 0; top: 0; width: 1600px; height: 40px; background: #24262b; border-bottom: 1px solid rgba(255,255,255,.07); }
      .ph { position: absolute; border-radius: 8px; background: #16181c; border: 1px solid #22252a; }
      #cap { position: absolute; left: 184px; top: 236px; font-family: "JetBrains Mono", monospace; font-size: 16px; letter-spacing: .1em; color: #8a8f99; }
      .slot { position: absolute; left: 1276px; top: 236px; width: 460px; height: 260px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="20">
      <section id="bg" class="clip" data-start="0" data-duration="20" data-track-index="0">
        <div id="grid"></div>
        <div id="win">
          <div id="chrome"></div>
          <div class="ph" style="left:24px;top:64px;width:1060px;height:300px"></div>
          <div class="ph" style="left:24px;top:388px;width:1552px;height:296px"></div>
        </div>
        <div id="cap">PLACEHOLDER APP WINDOW · LIVE DIAGRAM PREVIEW</div>
      </section>

      <!-- 1. register (0–5 s) -->
      <div id="ld-register" class="slot" data-composition-id="live-diagram" data-composition-src="compositions/diagram.html"
        data-variable-values='{"mode":"register","steps":"0.6"}'
        data-start="0" data-duration="5" data-track-index="1" data-width="460" data-height="260"></div>
      <!-- 2. refusal (5–10 s) -->
      <div id="ld-refusal" class="slot" data-composition-id="live-diagram" data-composition-src="compositions/diagram.html"
        data-variable-values='{"mode":"refusal","steps":"0.6"}'
        data-start="5" data-duration="5" data-track-index="1" data-width="460" data-height="260"></div>
      <!-- 3. claim (10–20 s), custom step times -->
      <div id="ld-claim" class="slot" data-composition-id="live-diagram" data-composition-src="compositions/diagram.html"
        data-variable-values='{"mode":"claim","steps":"0.5,2.0,3.5,5.0,6.5","amount":"R$1,500"}'
        data-start="10" data-duration="10" data-track-index="1" data-width="460" data-height="260"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#grid", { opacity: 1 }, { opacity: 1, duration: 0.1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
