      .vp { position: absolute; left: 0; top: 40px; width: 1422px; height: 800px; overflow: hidden; background: #0f1012; }

      /* illustrated dashboard */
      .side { position: absolute; left: 0; top: 0; width: 220px; height: 800px; background: #131417; border-right: 1px solid #22252a; }
      .side .it { position: absolute; left: 16px; width: 188px; height: 40px; border-radius: 8px; display: flex; align-items: center; gap: 12px; padding-left: 14px; font-size: 19px; color: #b4b8c0; font-weight: 500; }

      .kpi .v { position: absolute; left: 20px; top: 44px; font-family: var(--font-display); font-weight: 600; font-size: 44px; letter-spacing: -0.02em; }
      .list { position: absolute; left: 252px; top: 232px; width: 1138px; height: 548px; border-radius: 12px; background: #16181c; border: 1px solid #2a2d33; overflow: hidden; }
      .lt { position: absolute; left: 24px; top: 15px; font-family: var(--font-display); font-weight: 600; font-size: 24px; }
      .lc { position: absolute; left: 252px; top: 19px; font-family: var(--font-mono); font-size: 16px; color: #3dab72; background: rgba(61,171,114,.12); border-radius: 999px; padding: 3px 10px; }
      .cols, .row { position: absolute; left: 0; width: 1138px; height: 48px; }
      .cols { top: 58px; border-bottom: 1px solid #2a2d33; }
      .cols span { position: absolute; top: 14px; font-family: var(--font-mono); font-size: 15px; letter-spacing: .1em; color: #a3a8b1; }
      .row { border-bottom: 1px solid #202328; opacity: 0; }
      .row span { position: absolute; top: 11px; font-size: 20px; color: #f0f0ee; white-space: nowrap; }
      .row .m { font-family: var(--font-mono); font-size: 19px; color: #c3c7ce; top: 12px; }
      .row .pill { top: 9px; font-family: var(--font-mono); font-size: 16px; color: #3dab72; background: rgba(61,171,114,.12); border: 1px solid rgba(61,171,114,.35); border-radius: 999px; padding: 3px 12px; }
      .row.ana { background: rgba(232,160,32,.08); box-shadow: inset 3px 0 0 #e8a020; }
      .row.ana .t { color: #f0f0ee; font-weight: 600; }
      .c1 { left: 24px; } .c2 { left: 240px; } .c3 { left: 600px; } .c4 { left: 790px; } .c5 { left: 980px; }

      .chip { position: absolute; left: 892px; top: 104px; height: 34px; padding: 0 14px; border-radius: 8px; display: flex; align-items: center; gap: 10px;
        background: rgba(14,15,17,.9); border: 1px solid #3a3d44; font-family: var(--font-mono); font-size: 14px; letter-spacing: .05em; color: #c3c7ce; opacity: 0; white-space: nowrap; }
      .chip i { width: 7px; height: 7px; border-radius: 50%; background: #e8a020; display: block; }
      .chip i { width: 7px; height: 7px; border-radius: 50%; background: #e8a020; display: block; }

      #loi { position: absolute; left: 1516px; top: 100px; width: 300px; height: 158px; border-radius: 14px; opacity: 0;
        background: rgba(22,24,28,.94); border: 1px solid rgba(232,160,32,.55); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8), 0 0 40px rgba(232,160,32,.18); }
      #loiN { position: absolute; left: 24px; top: 14px; font-family: var(--font-display); font-weight: 600; font-size: 64px; color: #e8a020; letter-spacing: -0.02em; line-height: 1.1; }
      #loiS { position: absolute; left: 24px; top: 122px; font-family: var(--font-sans); font-size: 16px; color: #a3a8b1; }
      #loiT { position: absolute; left: 24px; top: 92px; font-family: var(--font-mono); font-size: 17px; letter-spacing: .06em; color: #f0f0ee; }

      #badge { position: absolute; left: 0; top: 724px; width: 1920px; display: flex; justify-content: center; opacity: 0; }
      .badgeIn { position: relative; display: flex; align-items: center; gap: 18px; padding: 18px 30px 18px 26px; border-radius: 14px;
        background: rgba(18,19,22,.92); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 70px -20px rgba(0,0,0,.85); }
      .badgeIn b { width: 5px; height: 40px; border-radius: 3px; background: #e8a020; display: block; }
      .badgeIn span { font-family: var(--font-sans); font-size: 27px; font-weight: 500; color: #f0f0ee; white-space: nowrap; }
      .badgeIn em { font-style: normal; color: #e8a020; font-weight: 600; }
      .badgeIn .s2 { color: #8a8f99; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="3.0">
      <section id="stage" class="clip" data-start="0" data-duration="3.0" data-track-index="0">
        <div id="grid"></div>
        <!-- ================= LOGO (ident → signature) ================= -->
        <div id="identWrap">
          <div id="ident">
            <svg id="mark" viewBox="0 0 72 60">
              <defs>
                <clipPath id="markClip">
                  <path d="M25.2002 3.59711C20.8004 7.26576 18.0001 12.7878 18 18.9643V59.0434C17.1113 59.3022 16.1724 59.4438 15.2002 59.4438H0V20.0444C0 8.99868 8.95431 0.0443737 20 0.0443726H25.2002V3.59711Z"/>
                  <path d="M19.8 28.8H45V49.4C45 54.9228 40.5228 59.4 35 59.4H19.8V28.8Z"/>
                  <path d="M45 0H39.8C28.7543 0 19.8 8.95431 19.8 20V35.8C19.8 36.9046 20.6954 37.8 21.8 37.8H45V0Z"/>
                  <path d="M72 0H66.8C55.7543 0 46.8 8.95431 46.8 20V31.8C46.8 35.1137 49.4863 37.8 52.8 37.8H72V0Z"/>
                </clipPath>
                <linearGradient id="shineG" x1="0" x2="1" y1="0" y2="0">
                  <stop offset="0" stop-color="#ffd28a" stop-opacity="0"/>
                  <stop offset=".5" stop-color="#ffd28a" stop-opacity=".95"/>
                  <stop offset="1" stop-color="#ffd28a" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <path id="m1" class="sh" pathLength="1" d="M25.2002 3.59711C20.8004 7.26576 18.0001 12.7878 18 18.9643V59.0434C17.1113 59.3022 16.1724 59.4438 15.2002 59.4438H0V20.0444C0 8.99868 8.95431 0.0443737 20 0.0443726H25.2002V3.59711Z"/>
              <path id="m2" class="sh" pathLength="1" d="M45 0H39.8C28.7543 0 19.8 8.95431 19.8 20V35.8C19.8 36.9046 20.6954 37.8 21.8 37.8H45V0Z"/>
              <path id="m3" class="sh" pathLength="1" d="M19.8 28.8H45V49.4C45 54.9228 40.5228 59.4 35 59.4H19.8V28.8Z"/>
              <path id="m4" class="sh" pathLength="1" d="M72 0H66.8C55.7543 0 46.8 8.95431 46.8 20V31.8C46.8 35.1137 49.4863 37.8 52.8 37.8H72V0Z"/>
              <rect id="m5" class="sh pill" pathLength="1" x="46.8" y="43.2" width="25.2" height="16.2" rx="8.1"/>
              <g clip-path="url(#markClip)"><rect id="shine" x="-30" y="-10" width="22" height="80" fill="url(#shineG)" transform="skewX(-18)" style="opacity:0"/></g>
            </svg>
            <div id="wordBox"><div class="word" id="word">mutav</div></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      function build() {
        const tl = gsap.timeline({ paused: true });
        const E = { o: "expo.out", io: "expo.inOut" };
        tl.fromTo("#grid", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
        const parts = ["#m1", "#m2", "#m3", "#m4"];
        // mark builds
        tl.fromTo(parts, { scale: 0.9, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.8, stagger: 0.08, ease: E.o }, 0.15);
        tl.to(parts, { strokeDashoffset: 0, duration: 0.5, stagger: 0.08, ease: "power2.inOut" }, 0.15);
        tl.to(parts, { fillOpacity: 1, duration: 0.3, stagger: 0.08, ease: "power2.out" }, 0.55);
        tl.to(parts, { strokeOpacity: 0, duration: 0.3, stagger: 0.08 }, 0.8);
        // (a) mark lands: amber pill pops in, settles at 1.20
        tl.fromTo("#m5", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 0.9);
        tl.to("#m5", { strokeDashoffset: 0, fillOpacity: 1, duration: 0.15 }, 0.9);
        // (b) wordmark wipes in, complete at 1.60
        tl.fromTo("#word", { clipPath: "inset(0 100% 0 -4%)" }, { clipPath: "inset(0 -6% 0 -4%)", duration: 0.45, ease: "power3.out" }, 1.15);
        // one restrained light sweep
        tl.set("#shine", { opacity: 1 }, 1.7);
        tl.fromTo("#shine", { x: -30 }, { x: 110, duration: 0.45, ease: "power2.inOut" }, 1.7);
        tl.set("#shine", { opacity: 0 }, 2.16);
        // hold, then one move to the top-left signature, landing at 3.0
        const r = document.getElementById("ident").getBoundingClientRect();
        tl.to("#ident", { x: 309 - r.left, y: 49 - r.top, scale: 22 / 200, transformOrigin: "0 0", duration: 0.6, ease: E.io }, 2.4);
        window.__timelines["main"] = tl;
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(build); else build();
    </script>
  </body>
