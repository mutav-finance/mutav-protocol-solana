<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>MUTAV claim flow</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; font-weight: 100 900; font-style: normal; src: url("assets/fonts/Geist.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; font-style: normal; src: url("assets/fonts/Inter.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; font-style: normal; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0e0f11; color: #f0f0ee; font-family: "Inter", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0e0f11; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      #grid { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        background-image: linear-gradient(to right, rgba(240,240,238,.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(240,240,238,.04) 1px, transparent 1px);
        background-size: 48px 48px; }
      #ill { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; transform: translateY(40px) scale(1.2); transform-origin: 960px 440px; }
      #ill text { font-family: "JetBrains Mono", monospace; }
      .w { fill: none; stroke: #f0f0ee; stroke-width: 2.5; stroke-linejoin: round; }
      .w2 { fill: none; stroke: #8a8f99; stroke-width: 2; }
      .a { fill: none; stroke: #e8a020; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .lbl { font-size: 22px; letter-spacing: .08em; fill: #f0f0ee; text-anchor: middle; }
      .d { stroke-dasharray: 1 1.2; stroke-dashoffset: 1.1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="3.5">
      <section id="stage" class="clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div id="grid"></div>
        <div id="flow" style="position:absolute;left:0;top:34px;width:1920px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.06em;color:#c3c7ce;opacity:0">Agency files <span style="color:#8a8f99">→</span> operator verifies <span style="color:#8a8f99">→</span> reserve pays <span style="color:#8a8f99">→</span> <span style="color:#e8a020">PIX to agency</span></div>
        <svg id="ill" viewBox="0 0 1920 1080">
          <defs><clipPath id="vc"><rect x="892" y="152" width="136" height="166" rx="16"/></clipPath></defs>
          <g id="base" style="opacity:0">
            <path d="M250 600 H1670" stroke="#2a2d33" stroke-width="2" fill="none"/>
            <!-- Ana's building -->
            <rect class="w" x="330" y="300" width="200" height="300" rx="3"/>
            <path class="w" d="M400 300 V266 H460 V300 M412 266 V252 H448 V266"/>
            <g class="w2">
              <rect x="352" y="322" width="36" height="26" rx="2"/><rect x="412" y="322" width="36" height="26" rx="2"/><rect x="472" y="322" width="36" height="26" rx="2"/>
              <rect x="352" y="366" width="36" height="26" rx="2"/><rect x="412" y="366" width="36" height="26" rx="2"/><rect x="472" y="366" width="36" height="26" rx="2"/>
              <rect x="352" y="410" width="36" height="26" rx="2"/><rect x="472" y="410" width="36" height="26" rx="2"/>
              <rect x="352" y="454" width="36" height="26" rx="2"/><rect x="412" y="454" width="36" height="26" rx="2"/><rect x="472" y="454" width="36" height="26" rx="2"/>
            </g>
            <rect class="a" x="412" y="410" width="36" height="26" rx="2" style="stroke-width:2.5"/>
            <rect class="w" x="410" y="526" width="40" height="74" rx="2"/>
            <circle class="a" cx="492" cy="560" r="10"/>
            <path class="a" d="M474 600 Q492 568 510 600"/>
            <text class="lbl" x="430" y="648">Ana · tenant</text>
            <!-- agency -->
            <rect class="w" x="872" y="440" width="176" height="160" rx="3"/>
            <path class="a" d="M862 440 L1058 440 L1046 470 Q1030 486 1014 470 Q998 486 982 470 Q966 486 950 470 Q934 486 918 470 Q902 486 886 470 Q874 482 874 470 Z"/>
            <rect class="w" x="944" y="530" width="32" height="70" rx="2"/>
            <rect class="w2" x="890" y="500" width="40" height="30" rx="2"/>
            <rect class="w2" x="990" y="500" width="40" height="30" rx="2"/>
            <text class="lbl" x="960" y="648">Agency</text>
            <!-- landlord -->
            <path class="w" d="M1380 452 L1490 362 L1600 452"/>
            <rect class="w" x="1402" y="440" width="176" height="160" rx="3"/>
            <rect class="w" x="1475" y="530" width="30" height="70" rx="2"/>
            <rect class="w2" x="1420" y="470" width="38" height="34" rx="2"/>
            <rect class="w2" x="1522" y="470" width="38" height="34" rx="2"/>
            <text class="lbl" x="1490" y="648">Landlord</text>
            <!-- MUTAV reserve (on Solana) above the agency -->
            <g clip-path="url(#vc)"><rect x="890" y="200" width="140" height="120" fill="#e8a020" fill-opacity=".9"/></g>
            <rect class="a" x="890" y="150" width="140" height="170" rx="18" style="stroke-width:3.5"/>
            <path class="a" d="M906 138 H1014" style="stroke-width:3.5"/>
            <g transform="translate(930 214) scale(.83)">
              <path d="M25.2002 3.59711C20.8004 7.26576 18.0001 12.7878 18 18.9643V59.0434C17.1113 59.3022 16.1724 59.4438 15.2002 59.4438H0V20.0444C0 8.99868 8.95431 0.0443737 20 0.0443726H25.2002V3.59711Z" fill="#f0f0ee"/>
              <path d="M19.8 28.8H45V49.4C45 54.9228 40.5228 59.4 35 59.4H19.8V28.8Z" fill="#f0f0ee"/>
              <path d="M45 0H39.8C28.7543 0 19.8 8.95431 19.8 20V35.8C19.8 36.9046 20.6954 37.8 21.8 37.8H45V0Z" fill="#f0f0ee"/>
              <rect x="46.8" y="43.2" width="25.2" height="16.2" rx="8.1" fill="#0e0f11"/>
              <path d="M72 0H66.8C55.7543 0 46.8 8.95431 46.8 20V31.8C46.8 35.1137 49.4863 37.8 52.8 37.8H72V0Z" fill="#f0f0ee"/>
            </g>
            <text class="lbl" x="866" y="222" style="text-anchor:end;fill:#e8a020">MUTAV RESERVE</text>
            <text class="lbl" x="866" y="254" style="text-anchor:end;fill:#a3a8b1;font-size:20px">ON SOLANA</text>
            <!-- rent arrow Ana → agency -->
            <path id="rent" d="M548 520 H850 M834 508 L852 520 L834 532" fill="none" stroke="#e8a020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <!-- beat 1: rent missed -->
          <g id="x" style="opacity:0"><path d="M686 506 l28 28 M714 506 l-28 28" stroke="#c94040" stroke-width="5" stroke-linecap="round"/></g>
          <text id="missL" class="lbl" x="700" y="572" style="fill:#e06060;opacity:0">RENT LATE</text>
          <!-- beat 2: agency files the claim: doc agency → reserve -->
          <g id="doc" style="opacity:0">
            <rect x="-18" y="-24" width="36" height="48" rx="4" fill="#0e0f11" stroke="#f0f0ee" stroke-width="2.5"/>
            <path d="M-10 -10 H10 M-10 -1 H10 M-10 8 H4" stroke="#8a8f99" stroke-width="2"/>
          </g>
          <text id="fileL" class="lbl" x="872" y="330" style="text-anchor:end;font-size:20px;opacity:0">Agency files the claim</text>
          <!-- beat 3: operator verifies -->
          <g id="vchk" style="opacity:0">
            <circle cx="1030" cy="150" r="17" fill="#0e0f11" stroke="#3dab72" stroke-width="3"/>
            <path d="M1022 150 l6 6 l10 -11" fill="none" stroke="#3dab72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <text id="verL" class="lbl" x="1060" y="200" style="text-anchor:start;fill:#3dab72;opacity:0">Operator verifies ✓</text>
          <!-- beat 4: reserve pays the agency -->
          <path id="pay" class="a d" pathLength="1" d="M960 326 V424 M948 410 L960 426 L972 410" style="stroke-width:4"/>
          <text id="payL" class="lbl" x="938" y="388" style="text-anchor:end;fill:#e8a020;opacity:0">R$1,500 · PIX</text>
          <!-- beat 5: agency forwards PIX to the landlord -->
          <path id="pix" class="a d" pathLength="1" d="M1062 520 H1388 M1374 510 L1390 520 L1374 530" style="stroke:#8a8f99;stroke-width:2.5"/>
          <text id="pixL" class="lbl" x="1225" y="500" style="fill:#a3a8b1;font-size:20px;opacity:0">Agency pays the landlord</text>
          <g id="agChk" style="opacity:0">
            <circle cx="1070" cy="430" r="22" fill="#0e0f11" stroke="#3dab72" stroke-width="3.5"/>
            <path d="M1060 431 l7 7 l13 -14" fill="none" stroke="#3dab72" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <g id="check" style="opacity:0">
            <circle cx="1600" cy="372" r="20" fill="#0e0f11" stroke="#8a8f99" stroke-width="2.5"/>
            <path d="M1591 373 l6 6 l12 -13" fill="none" stroke="#8a8f99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <!-- beat 6 -->
          <text id="chainL" class="lbl" x="980" y="360" style="text-anchor:start;fill:#3dab72;opacity:0">PIX recorded on-chain ✓</text>
        </svg>
      </section>
    </div>
    <script>
      function build() {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(["#base", "#flow"], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0);
        // (1) rent missed
        tl.to("#rent", { stroke: "#c94040", duration: 0.12 }, 0.3);
        tl.fromTo("#x", { opacity: 0, scale: 0.5, svgOrigin: "700 520" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, 0.35);
        tl.fromTo("#missL", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.5);
        // (2) agency files the claim: doc agency → reserve
        tl.set("#doc", { x: 960, y: 408 }, 0);
        tl.fromTo("#doc", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0.8);
        tl.fromTo("#fileL", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.82);
        tl.to("#doc", { y: 300, duration: 0.35, ease: "expo.inOut" }, 0.88);
        tl.to("#doc", { opacity: 0, duration: 0.1 }, 1.2);
        // (3) operator verifies
        tl.fromTo("#vchk", { opacity: 0, scale: 0.5, svgOrigin: "1030 150" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, 1.3);
        tl.fromTo("#verL", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 1.38);
        tl.to("#fileL", { opacity: 0.45, duration: 0.15 }, 1.38);
        // (4) reserve releases R$1,500 by PIX to the agency
        tl.to("#pay", { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, 1.8);
        tl.fromTo("#payL", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 2.05);
        tl.fromTo("#agChk", { opacity: 0, scale: 0.5, svgOrigin: "1070 430" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, 2.1);
        // (6) agency pays the landlord (off-chain, secondary)
        tl.to("#pix", { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, 2.6);
        tl.fromTo("#pixL", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 2.75);
        tl.fromTo("#check", { opacity: 0, scale: 0.5, svgOrigin: "1600 372" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 2.95);
        // (5) PIX to the agency recorded on-chain
        tl.fromTo("#chainL", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.25);
        window.__timelines["main"] = tl;
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(build); else build();
    </script>
  </body>
</html>
