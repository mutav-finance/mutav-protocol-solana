<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>MUTAV demo: agency platform flash</title>
    <!-- GSAP vendored locally (3.14.2) so the render needs no network -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; font-weight: 100 900; font-style: normal; src: url("assets/fonts/Geist.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; font-style: normal; src: url("assets/fonts/Inter.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; font-style: normal; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); }

      /* Brand tokens (overlays/caption.html, cards/*) */
      :root {
        --canvas: #0e0f11; --surface: #16181c; --border: #2a2d33; --text: #f0f0ee; --text-2: #8a8f99; --text-3: #555b66;
        --accent: #e8a020; --glass: rgba(22, 24, 28, 0.94);
        --font-display: "Geist", "Helvetica Neue", Arial, sans-serif;
        --font-sans: "Inter", "Helvetica Neue", Arial, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--canvas); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--canvas); }
      .clip { position: absolute; inset: 0; overflow: hidden; }

      /* ---------- Stage: grid, amber spill, vignette, grain (stage only; UI pixels stay untreated) ---------- */
      #grid { position: absolute; left: -48px; top: -48px; width: 2016px; height: 1176px;
        background-image: linear-gradient(to right, rgba(240,240,238,.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(240,240,238,.04) 1px, transparent 1px);
        background-size: 48px 48px; }
      #spill { position: absolute; left: 140px; top: 120px; width: 1100px; height: 800px;
        background: radial-gradient(closest-side, rgba(232,160,32,.10), rgba(232,160,32,0) 100%); }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 58% 45%, rgba(14,15,17,0) 45%, rgba(6,7,8,.82) 100%); }
      #grain { position: absolute; left: -128px; top: -128px; width: 2176px; height: 1336px; opacity: .07; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch' seed='7'/><feColorMatrix type='saturate' values='0'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>");
        background-size: 256px 256px; }

      /* ---------- Camera + window ---------- */
      #camera { position: absolute; inset: 0; transform-origin: 646px 342px; }
      #persp { position: absolute; left: 300px; top: 150px; width: 1512px; height: 612px; perspective: 2600px; perspective-origin: 50% 50%; }
      #win { position: absolute; inset: 0; transform-origin: 50% 50%; border-radius: 14px; }
      #win-shadow { position: absolute; inset: 0; border-radius: 14px;
        box-shadow: 0 80px 160px -20px rgba(0,0,0,.75), 0 30px 60px -10px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
      #win-body { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; background: #1a1c20; }
      #rim { position: absolute; left: -1px; top: 24px; width: 2px; height: 520px; border-radius: 2px;
        background: linear-gradient(to bottom, rgba(232,160,32,0), rgba(232,160,32,.95) 30%, rgba(232,160,32,.55) 70%, rgba(232,160,32,0));
        box-shadow: 0 0 18px 2px rgba(232,160,32,.45), 0 0 60px 6px rgba(232,160,32,.18); }

      /* Chrome: dark glass, macOS-style */
      #chrome { position: absolute; left: 0; top: 0; width: 1512px; height: 52px;
        background: linear-gradient(to bottom, rgba(44,46,52,.98), rgba(30,32,36,.98)); border-bottom: 1px solid rgba(255,255,255,.07); }
      .lights { position: absolute; left: 20px; top: 20px; display: flex; gap: 8px; }
      .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
      .lights i:nth-child(1) { background: #ec6a5e; } .lights i:nth-child(2) { background: #e0b33f; } .lights i:nth-child(3) { background: #5fbf52; }
      .tab { position: absolute; left: 96px; top: 10px; width: 300px; height: 32px; border-radius: 8px; background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 10px; padding: 0 12px; }
      .fav { width: 12px; height: 12px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px rgba(232,160,32,.6); flex: none; }
      .tab span { font-family: var(--font-sans); font-size: 13.5px; font-weight: 500; color: #e6e6e3; white-space: nowrap; letter-spacing: -.005em; }
      .addr { position: absolute; left: 556px; top: 11px; width: 400px; height: 30px; border-radius: 8px; background: rgba(0,0,0,.28);
        border: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; }
      .addr span { font-family: var(--font-sans); font-size: 13.5px; font-weight: 500; color: #b9bcc3; letter-spacing: .01em; white-space: nowrap; }

      /* Viewport: real screenshots, cropped only (source px = display px, 1x) */
      #viewport { position: absolute; left: 0; top: 52px; width: 1512px; height: 560px; overflow: hidden; background: #f5f4f1; }
      .crop { position: absolute; overflow: hidden; }
      .crop > img { position: absolute; display: block; width: 1512px; height: 801px; }
      /* Sidebar: top shot x 0..296, y 0..560 (user email at y~745 stays out) */
      #sidebar { left: 0; top: 0; width: 296px; height: 560px; }
      #sidebar { background: url("assets/shots/dash-top.png") 0 0 / 1512px 801px no-repeat; }
      /* Main column: sticky top bar, then the scroll area */
      #topbar { left: 296px; top: 0; width: 1216px; height: 57px; z-index: 2; }
      #topbar { background: url("assets/shots/dash-top.png") -296px 0 / 1512px 801px no-repeat; }
      #scroller { left: 296px; top: 57px; width: 1216px; height: 503px; }
      #column { position: absolute; left: 0; top: 0; width: 1216px; height: 663px; }
      /* Part A: KPI cards row, top shot y 57..250 (the "Book in force" chart starts at y~251, cropped out) */
      #partA { left: 0; top: 0; width: 1216px; height: 193px; }
      #partA > img { left: -296px; top: -57px; }
      /* Part B: "Where the book sits" pipeline + exits + filter row, lifecycle shot y 170..640 (table rows with R$ start at y~690, cropped out) */
      #partB { left: 0; top: 193px; width: 1216px; height: 470px; }
      #partB > img { left: -296px; top: -170px; }

      /* Amber bloom on the KPI number and on the Active node (DOM light around real pixels, pixels untouched) */
      #kpi-halo { position: absolute; left: 24px; top: 24px; width: 278px; height: 147px; border-radius: 3px;
        box-shadow: 0 0 0 1.5px rgba(232,160,32,.85), 0 0 26px 4px rgba(232,160,32,.38), 0 0 80px 10px rgba(232,160,32,.16); }
      #kpi-glow { position: absolute; left: 0; top: 33px; width: 100px; height: 100px; border-radius: 50%; mix-blend-mode: multiply;
        background: radial-gradient(closest-side, rgba(232,160,32,.42), rgba(232,160,32,0)); }
      #active-halo { position: absolute; left: 272px; top: 88px; width: 202px; height: 62px; border-radius: 3px;
        box-shadow: 0 0 0 1.5px rgba(232,160,32,.9), 0 0 24px 4px rgba(232,160,32,.4), 0 0 70px 12px rgba(232,160,32,.18); }
      #active-glow { position: absolute; left: 256px; top: 60px; width: 100px; height: 100px; border-radius: 50%; mix-blend-mode: multiply;
        background: radial-gradient(closest-side, rgba(232,160,32,.40), rgba(232,160,32,0)); }

      /* Specular sweep across the glass */
      #sweep-clip { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; pointer-events: none; }
      #sweep { position: absolute; left: 0; top: -200px; width: 260px; height: 1012px; mix-blend-mode: screen;
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,236,200,.10) 40%, rgba(255,255,255,.22) 50%, rgba(255,236,200,.10) 60%, rgba(255,255,255,0)); }

      /* ---------- Honesty label (HTML, brand style of overlays/honesty-agency.png), bottom-left ---------- */
      #label { position: absolute; left: 72px; bottom: 214px; display: flex; align-items: center; gap: 16px; padding: 14px 26px 15px 22px;
        background: rgba(30,31,35,.94); border: 1px solid var(--border); }
      #label i { width: 4px; height: 30px; background: var(--accent); display: block; flex: none; }
      #label span { font-family: var(--font-sans); font-size: 26px; font-weight: 500; color: var(--text); white-space: nowrap; letter-spacing: -.005em; }
      #label b { font-weight: 500; color: var(--text-2); padding: 0 4px; }

      /* ---------- Caption (brand caption style, overlays/caption.html) ---------- */
      .cap-clip { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 64px; }
      .cap-line { display: block; font-family: var(--font-sans); font-weight: 500; font-size: 44px; line-height: 1.45; color: #fff;
        background: rgba(14,15,17,.80); padding: 2px 18px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1920" data-height="1080">
      <!-- Stage -->
      <div id="stage" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="grid" data-layout-allow-overflow></div>
        <div id="spill"></div>
        <div id="vignette"></div>
        <div id="grain" data-layout-allow-overflow></div>
      </div>

      <!-- Browser window -->
      <div id="shot" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="camera" data-layout-allow-overflow>
          <div id="persp">
            <div id="win" data-layout-allow-overflow>
              <div id="win-shadow"></div>
              <div id="win-body">
                <div id="chrome">
                  <div class="lights"><i></i><i></i><i></i></div>
                  <div class="tab"><div class="fav"></div><span>MUTAV — Agency platform</span></div>
                  <div class="addr"><span>MUTAV · Agency platform</span></div>
                </div>
                <div id="viewport">
                  <div id="sidebar" class="crop"></div>
                  <div id="topbar" class="crop"></div>
                  <div id="scroller" class="crop">
                    <div id="column" data-layout-allow-overflow data-hf-motion-blur='{"samplesPerFrame": 8, "shutterAngle": 360, "sharp": 1}'>
                      <div id="partA" class="crop">
                        <img src="assets/shots/dash-top.png" alt="" data-layout-allow-overflow />
                        <div id="kpi-glow"></div>
                        <div id="kpi-halo"></div>
                      </div>
                      <div id="partB" class="crop">
                        <img src="assets/shots/dash-lifecycle.png" alt="" data-layout-allow-overflow />
                        <div id="active-glow"></div>
                        <div id="active-halo"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div id="sweep-clip"><div id="sweep" data-layout-allow-overflow></div></div>
              <div id="rim"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Honesty label: whole shot -->
      <div id="label-clip" class="clip" data-start="0" data-duration="6" data-track-index="2">
        <div id="label"><i></i><span>Agency platform <b>·</b> pre-hackathon <b>·</b> not on-chain yet</span></div>
      </div>

      <!-- Caption -->
      <div id="cap" class="clip cap-clip" data-start="0.3" data-duration="5.7" data-track-index="3">
        <span class="cap-line" id="cap-l1">Her agency works in MUTAV’s platform;</span>
        <span class="cap-line" id="cap-l2">every lease becomes an account on-chain.</span>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Stage: slow parallax drift of the grid against the window, grain flicker (stepped, deterministic)
      tl.fromTo("#grid", { y: 30, x: 0 }, { y: -18, x: -14, duration: 6, ease: "none" }, 0);
      tl.fromTo("#spill", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 1.4, ease: "power2.out" }, 0.1);
      tl.fromTo("#grain", { x: 0, y: 0 }, { x: -120, y: -97, duration: 6, ease: "steps(90)" }, 0);

      // Window rises from slight depth (expo-out), tilted ~6 deg; straightens by ~4.5 s
      tl.fromTo("#win", { y: 110, z: -260, rotationY: -9, rotationX: 5, opacity: 0 },
                        { y: 0, z: 0, rotationY: -6, rotationX: 3, opacity: 1, duration: 0.7, ease: "expo.out" }, 0);
      tl.to("#win", { rotationY: 0, rotationX: 0, duration: 3.8, ease: "power2.inOut" }, 0.7);
      tl.fromTo("#rim", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.35);

      // Specular sweep across the glass at ~1.2 s
      tl.fromTo("#sweep", { x: -420, rotation: 14 }, { x: 1700, rotation: 14, duration: 1.0, ease: "power2.inOut" }, 1.15);

      // Gentle push-in toward "Guarantees in force 4", amber bloom on the number
      tl.fromTo("#camera", { scale: 1 }, { scale: 1.08, duration: 1.7, ease: "power2.inOut" }, 0.9);
      tl.fromTo(["#kpi-halo", "#kpi-glow"], { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 1.45);
      tl.to(["#kpi-halo", "#kpi-glow"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 2.65);

      // Scroll from the KPI row to "Where the book sits" (motion blur on #column), camera eases back to full window
      tl.fromTo("#column", { y: 0 }, { y: -160, duration: 0.7, ease: "expo.inOut" }, 2.8);
      tl.to("#camera", { scale: 1, duration: 0.9, ease: "power3.inOut" }, 2.75);

      // "Active 4" node: soft amber bloom
      tl.fromTo(["#active-halo", "#active-glow"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.65);

      // Honesty label visible from the first frames
      tl.fromTo("#label", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);

      // Caption: mask reveal, line by line
      tl.fromTo("#cap-l1", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "expo.out" }, 0.3);
      tl.fromTo("#cap-l2", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "expo.out" }, 0.45);

      window.__timelines["main"] = tl;
    </script>
    <!-- motion-blur registry component (installed via `hyperframes add motion-blur`), loaded after GSAP -->
    <script src="vendor/motion-blur.js"></script>
  </body>
</html>
