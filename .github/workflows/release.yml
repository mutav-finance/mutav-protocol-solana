# Release: verified build → executable hash → buffer → Squads upgrade
# proposal (spec §14.5 runbook, plan Task 12).
#
# Manual only. Without the secrets below it is inert past the build: the
# buffer and proposal steps skip with a notice. It never executes an upgrade:
# Squads members review, approve and execute the proposal after the time lock.
#
# Secrets (not set in this repo; the founder adds them per environment):
#   RELEASE_RPC_URL           Full http(s) RPC URL of the target cluster; the
#                             cluster guard checks its genesis hash (devnet only)
#   RELEASE_BUFFER_PAYER      JSON keypair that pays for the buffer (holds SOL
#                             only; it never holds program or admin authority)
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag or commit to release (e.g. v0.1.0)"
        required: true
      cluster:
        description: "Target cluster"
        required: true
        type: choice
        options: [devnet]
      multisig:
        description: "Squads multisig that holds the upgrade authority (spec §12 Q15)"
        required: true
      vault_index:
        description: "Squads vault index"
        required: false
        default: "0"
      attach_to_release:
        description: "Attach mutav.so, mutav.json (IDL) and the hash to the GitHub release of `ref`"
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.cluster }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOLANA_VERSION: "4.1.2"
  ANCHOR_VERSION: "1.2.0"
  SOLANA_VERIFY_VERSION: "0.5.2"
  PROGRAM_ID: "8scC79jkU7SPM9v6M4nB833R8EeqKknfwdRdjn73Qqv9"
  NO_DNA: "1"

jobs:
  build:
    # x86: the verified build image and the hash explorers recompute.
    runs-on: ubuntu-24.04
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Rust toolchain
        run: rustup toolchain install

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install solana-verify and Anchor
        run: |
          cargo install solana-verify --version "${SOLANA_VERIFY_VERSION}" --locked
          cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      # 1. Verified build (Docker) and executable hash.
      - name: solana-verify build
        run: solana-verify build --library-name mutav

      - name: Executable hash
        id: hash
        run: |
          hash="$(solana-verify get-executable-hash target/deploy/mutav.so)"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          echo "${hash}" > mutav.hash
          printf '### Executable hash\n`%s` (ref `%s`, commit `%s`)\n' "${hash}" "${{ inputs.ref }}" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # The IDL for Program Metadata and for the idl-compat CI job.
      - name: IDL
        run: |
          anchor idl build -p mutav -o mutav.json
          cp target/deploy/mutav.so mutav.so

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.ref }}
          path: |
            mutav.so
            mutav.json
            mutav.hash

  attach:
    needs: build
    if: inputs.attach_to_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.ref }}
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.ref }}" mutav.so mutav.json mutav.hash --repo "${{ github.repository }}" --clobber

  buffer-and-propose:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.cluster }}
    env:
      HAS_SECRETS: ${{ secrets.RELEASE_RPC_URL != '' && secrets.RELEASE_BUFFER_PAYER != '' }}
    steps:
      - name: Inert without secrets
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::RELEASE_RPC_URL / RELEASE_BUFFER_PAYER not set for '${{ inputs.cluster }}'; build and hash only, no buffer or proposal."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_SECRETS == 'true'
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.HAS_SECRETS == 'true'
        with:
          name: release-${{ inputs.ref }}
          path: release

      - name: Install Solana CLI and solana-verify
        if: env.HAS_SECRETS == 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          cargo install solana-verify --version "${SOLANA_VERIFY_VERSION}" --locked

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.HAS_SECRETS == 'true'
        with:
          bun-version: "1.3.1"

      - name: Install JS deps
        if: env.HAS_SECRETS == 'true'
        run: bun install --frozen-lockfile

      # Refuses a moniker, an empty or local URL and any genesis hash but
      # devnet's; exports the normalised URL as RELEASE_RPC (masked) for every
      # later step, which never reads the raw secret.
      - name: Cluster guard
        if: env.HAS_SECRETS == 'true'
        env:
          RPC: ${{ secrets.RELEASE_RPC_URL }}
        run: bun scripts/release/guard-rpc.ts --confirm-cluster "${{ inputs.cluster }}"

      # The payer key exists only on the runner's disk for this job.
      - name: Buffer payer
        if: env.HAS_SECRETS == 'true'
        env:
          RELEASE_BUFFER_PAYER: ${{ secrets.RELEASE_BUFFER_PAYER }}
        run: |
          umask 077
          printf '%s' "$RELEASE_BUFFER_PAYER" > "$RUNNER_TEMP/payer.json"

      - name: Upgrade vault
        if: env.HAS_SECRETS == 'true'
        id: vault
        # Inputs reach the script as env values, never as interpolated code.
        env:
          MULTISIG: ${{ inputs.multisig }}
          VAULT_INDEX: ${{ inputs.vault_index }}
        run: |
          vault="$(bun -e "import { address } from '@solana/kit'; import { parseVaultIndex, squadsVaultAddress } from './scripts/devnet/lib/squads'; console.log(await squadsVaultAddress(address(process.env.MULTISIG), parseVaultIndex(process.env.VAULT_INDEX)))")"
          echo "vault=${vault}" >> "$GITHUB_OUTPUT"

      # 2–4. Buffer with authority set to the upgrade vault; its hash must
      # equal the executable hash.
      - name: Write buffer
        if: env.HAS_SECRETS == 'true'
        id: buffer
        run: |
          buffer="$(solana program write-buffer release/mutav.so --url "$RELEASE_RPC" --keypair "$RUNNER_TEMP/payer.json" --output json | jq -r .buffer)"
          solana program set-buffer-authority "$buffer" --new-buffer-authority "${{ steps.vault.outputs.vault }}" --url "$RELEASE_RPC" --keypair "$RUNNER_TEMP/payer.json"
          got="$(solana-verify get-buffer-hash "$buffer" --url "$RELEASE_RPC")"
          if [ "$got" != "${{ needs.build.outputs.hash }}" ]; then
            echo "::error::buffer hash $got != executable hash ${{ needs.build.outputs.hash }}"
            exit 1
          fi
          echo "buffer=${buffer}" >> "$GITHUB_OUTPUT"

      # 6. The upgrade instructions (ExtendProgramChecked first when the .so
      # outgrew ProgramData) as an unsigned proposal payload.
      - name: Upgrade proposal payload
        if: env.HAS_SECRETS == 'true'
        env:
          MULTISIG: ${{ inputs.multisig }}
          VAULT_INDEX: ${{ inputs.vault_index }}
        run: |
          bun scripts/release/upgrade-proposal.ts --url "$RELEASE_RPC" --confirm-cluster "${{ inputs.cluster }}" \
            --program "$PROGRAM_ID" --buffer "${{ steps.buffer.outputs.buffer }}" \
            --multisig "$MULTISIG" --vault-index "$VAULT_INDEX" \
            --so release/mutav.so --out upgrade-proposal.json

      # 5. Verify-PDA write, exported for the same vault transaction.
      - name: Verify-PDA transaction
        if: env.HAS_SECRETS == 'true'
        run: |
          solana-verify export-pda-tx "https://github.com/${{ github.repository }}" \
            --program-id "$PROGRAM_ID" --uploader "${{ steps.vault.outputs.vault }}" \
            --library-name mutav --commit-hash "$(git rev-parse HEAD)" --encoding base58 \
            --url "$RELEASE_RPC" > verify-pda-tx.b58

      - name: Remove the payer key
        if: always() && env.HAS_SECRETS == 'true'
        run: rm -f "$RUNNER_TEMP/payer.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.HAS_SECRETS == 'true'
        with:
          name: proposal-${{ inputs.ref }}
          path: |
            upgrade-proposal.json
            verify-pda-tx.b58

      - name: Summary
        if: env.HAS_SECRETS == 'true'
        run: |
          {
            echo "### Upgrade proposal (unsigned)"
            echo "- executable hash: \`${{ needs.build.outputs.hash }}\`"
            echo "- buffer: \`${{ steps.buffer.outputs.buffer }}\` (authority: vault \`${{ steps.vault.outputs.vault }}\`)"
            echo "- ref: \`${{ inputs.ref }}\`, commit \`$(git rev-parse HEAD)\`"
            echo
            echo "Next (spec §14.5 steps 6–10): a member bundles upgrade-proposal.json, the Program Metadata IDL write"
            echo "(\`program-metadata write idl\` exported for the vault) and verify-pda-tx.b58 into one vault transaction;"
            echo "every signer reproduces the hash from the tag and decodes each instruction before approving."
          } >> "$GITHUB_STEP_SUMMARY"
