# Surfpool fork tests (plan Task 13): on demand only. Surfpool forks devnet
# (reads over RPC) and executes locally; nothing is sent to devnet.
name: fork

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLANA_VERSION: "4.1.2"
  ANCHOR_VERSION: "1.2.0"
  CARGO_BUILD_JOBS: "4"
  NO_DNA: "1"

jobs:
  fork:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - name: Install Surfpool
        run: |
          curl -sSfL https://run.surfpool.run/ | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # CI has no program keypair (it never enters git): generate a throwaway
      # one and build the binary against its id, for this fork run only.
      - name: Throwaway program id
        run: |
          solana-keygen new --no-bip39-passphrase --silent --force -o "$RUNNER_TEMP/mutav-keypair.json"
          mkdir -p target/deploy
          cp "$RUNNER_TEMP/mutav-keypair.json" target/deploy/mutav-keypair.json
          anchor keys sync -p mutav

      - name: anchor build
        run: anchor build

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.1"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # The client's program address follows the IDL of this build.
      - name: Regenerate client for the throwaway id
        run: bun run generate:client

      - name: Fork happy path
        run: bun tests-fork/happy-path.ts --program-keypair "$RUNNER_TEMP/mutav-keypair.json"
