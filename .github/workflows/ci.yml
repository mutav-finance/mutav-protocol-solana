name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLANA_VERSION: "4.1.2"
  ANCHOR_VERSION: "1.2.0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  RUST_TEST_THREADS: "4"
  NO_DNA: "1"

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the channel pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-${{ env.ANCHOR_VERSION }}

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Versions
        run: |
          rustc --version
          solana --version
          anchor --version

      # CI has no program keypairs (they never enter git); skip the
      # keypair/declare_id check and build against the committed IDs.
      - name: anchor build
        run: anchor build --ignore-keys

      - name: cargo test (LiteSVM)
        run: cargo test -p mutav-tests

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.1"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Regenerate Codama client
        run: bun run generate:client

      - name: Fail if generated client is stale
        run: |
          if [ -n "$(git status --porcelain -- clients/js)" ]; then
            git status --porcelain -- clients/js
            git diff -- clients/js
            echo "::error::clients/js is out of date. Run 'anchor build && bun run generate:client' and commit."
            exit 1
          fi

      - name: Typecheck client
        run: bun run typecheck

      # The client composes; the caller signs (CLAUDE.md).
      - name: No secret-key or signing APIs in the client
        run: bash scripts/check-no-keys.sh clients/js/src

      - name: Client tests (math parity, PDAs, encoding, reads)
        run: bun test
        working-directory: clients/js

      - name: Script tests
        run: bun test scripts/test

      - name: Typecheck scripts
        run: bun run typecheck:scripts

      - name: Upload IDL
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idl
          path: target/idl/mutav.json
          retention-days: 7

  # The pilot web app (app/). Its postinstall builds clients/js from source
  # (root bun install + client build), so this job needs no Rust toolchain.
  # The Playwright smoke needs a validator and the program build; it runs
  # locally (`bun run e2e`), not here.
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.1"

      - name: Install app deps (builds clients/js)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Vitest)
        run: bun run test --maxWorkers=2

      - name: next build
        run: bun run build
        env:
          NEXT_PUBLIC_CLUSTER: devnet
          NEXT_TELEMETRY_DISABLED: "1"

  # Spec §14.4: from the first tagged release, the IDL may only change in
  # the allowed ways. Inactive (passes with a notice) until a `v*` tag exists.
  # The released IDL is the `mutav.json` asset that release.yml attaches to
  # the GitHub release of the tag.
  idl-compat:
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Last release tag
        id: tag
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::idl-compat inactive: no release tag yet (spec §14.4)"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.tag.outputs.tag != ''
        with:
          bun-version: "1.3.1"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.tag.outputs.tag != ''
        with:
          name: idl
          path: new-idl

      - name: Released IDL
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.tag.outputs.tag }}" --pattern mutav.json --dir released-idl

      - name: Compare
        if: steps.tag.outputs.tag != ''
        run: bun scripts/idl-compat.ts released-idl/mutav.json new-idl/mutav.json
