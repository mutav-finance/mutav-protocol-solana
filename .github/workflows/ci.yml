name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLANA_VERSION: "4.1.2"
  ANCHOR_VERSION: "1.2.0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  RUST_TEST_THREADS: "4"
  NO_DNA: "1"

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the channel pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-${{ env.ANCHOR_VERSION }}

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Versions
        run: |
          rustc --version
          solana --version
          anchor --version

      # CI has no program keypairs (they never enter git); skip the
      # keypair/declare_id check and build against the committed IDs.
      - name: anchor build
        run: anchor build --ignore-keys

      - name: cargo test (LiteSVM)
        run: cargo test -p mutav-tests

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.1"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Regenerate Codama client
        run: bun run generate:client

      - name: Fail if generated client is stale
        run: |
          if [ -n "$(git status --porcelain -- clients/js)" ]; then
            git status --porcelain -- clients/js
            git diff -- clients/js
            echo "::error::clients/js is out of date. Run 'anchor build && bun run generate:client' and commit."
            exit 1
          fi

      - name: Typecheck client
        run: bun run typecheck
